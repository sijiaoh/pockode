name: Install Script

on:
  push:
    branches: [main]
    paths:
      - "site/static/install.ps1"
      - "site/static/install.sh"
      - ".github/workflows/install.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/static/install.ps1"
      - "site/static/install.sh"
      - ".github/workflows/install.yml"
  workflow_dispatch:

jobs:
  # install.ps1 rewrites the user's PATH in the registry, and it is the only
  # supported way onto Windows. Neither of those can be checked by reading the
  # script, and no machine in this project runs Windows, so it is exercised end
  # to end: install, refuse a download that fails its checksum, upgrade over
  # it, uninstall, then the same cycle against a custom -InstallDir.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/.go-version
          cache-dependency-path: server/go.sum

      # The real binary, not a stub: the install is only proven if what lands on
      # PATH runs and answers -version. The frontend is not built here - the
      # embed directories ship a .keep, which is all `go build` needs.
      - name: Build pockode.exe
        working-directory: server
        run: |
          New-Item -ItemType Directory -Path ../.ci-serve -Force | Out-Null
          go build -o ../.ci-serve/pockode-windows-amd64.exe .

          # The same "<hash>  <name>" line scripts/build.sh publishes, LF and
          # lower case included: the install only proves anything if what it
          # verifies against has the shape a real release has. WriteAllText
          # rather than Set-Content, which would end the line with CRLF.
          $hash = (Get-FileHash ../.ci-serve/pockode-windows-amd64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path ../.ci-serve) 'checksums.txt'), "$hash  pockode-windows-amd64.exe`n")

      # Three releases that must not install: one whose binary does not match
      # the checksum published for it, one that publishes no checksums.txt at
      # all, and one whose checksums.txt covers other platforms but not this
      # one. Off in a subtree of their own, so what the steps above install from
      # stays exactly what a real release looks like.
      - name: Add releases that cannot be verified to the served tree
        working-directory: .ci-serve
        run: |
          function New-Fixture([string]$tag) {
            $dir = (New-Item -ItemType Directory -Path "download/$tag" -Force).FullName
            Copy-Item pockode-windows-amd64.exe $dir
            return $dir
          }

          # A byte appended after the checksum was taken is the same thing to
          # sha256 as a binary swapped for someone else's.
          $tampered = New-Fixture 'v0.0.0-tampered'
          Copy-Item checksums.txt $tampered
          Add-Content -LiteralPath (Join-Path $tampered 'pockode-windows-amd64.exe') -Value 'x' -NoNewline

          # Deliberately nothing beside it: a release from before checksums were
          # published looks exactly like this.
          New-Fixture 'v0.0.0-no-checksums' | Out-Null

          $other = New-Fixture 'v0.0.0-other-platform'
          (Get-Content -Raw checksums.txt).Replace('pockode-windows-amd64.exe', 'pockode-darwin-arm64') |
            Set-Content -LiteralPath (Join-Path $other 'checksums.txt') -NoNewline

          # The odd one out: this release is fine and has to install. Its
          # checksums.txt carries the same hash in the three shapes a file not
          # written by scripts/build.sh can arrive in - a "*" in front of the
          # name, which is how shasum writes a hash it took in binary mode;
          # CRLF endings, which a mirror serving the file through a text-mode
          # tool produces; and this platform's line somewhere other than first.
          $odd = New-Fixture 'v0.0.0-odd-checksums'
          $hash, $name = (Get-Content -LiteralPath checksums.txt -Raw).Trim() -split '\s+'
          [IO.File]::WriteAllText(
            (Join-Path $odd 'checksums.txt'),
            "$('0' * 64)  pockode-darwin-arm64`r`n$hash  *$name`r`n")

      # The released asset does not exist until this branch ships, and pointing
      # the test at a real release would test GitHub rather than the script.
      - name: Serve the binary locally
        run: |
          # Absolute: Start-Process resolves -WorkingDirectory against the .NET
          # process directory, not PowerShell's current location.
          Start-Process python -ArgumentList '-m', 'http.server', '8000' -WorkingDirectory (Resolve-Path .ci-serve)
          $url = 'http://127.0.0.1:8000/pockode-windows-amd64.exe'
          $ready = $false
          foreach ($attempt in 1..30) {
            try {
              Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing | Out-Null
              $ready = $true
              break
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $ready) { throw "local file server never came up at $url" }

      # An entry that is still a variable, in a REG_EXPAND_SZ value. This is the
      # regression that silently wrecks a PATH: an installer that reads it
      # expanded and writes it back freezes every other tool's entry into
      # whatever it points at today.
      - name: Seed the user PATH with a canary
        run: |
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $raw = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $entries = @($raw -split ';' | Where-Object { $_.Trim() -ne '' }) + '%USERPROFILE%\ci-canary'
          $key.SetValue('Path', ($entries -join ';'), [Microsoft.Win32.RegistryValueKind]::ExpandString)
          $key.Close()

      - name: Install
        run: ./site/static/install.ps1 -Url http://127.0.0.1:8000/pockode-windows-amd64.exe

      - name: Verify the install
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Pockode'
          if (-not (Test-Path (Join-Path $installDir 'pockode.exe'))) {
            throw "pockode.exe is not in $installDir"
          }

          # Resolve the command the way a terminal opened after the install would.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not (Get-Command pockode -ErrorAction SilentlyContinue)) {
            throw "pockode did not land on the user PATH"
          }
          pockode -version

          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $raw = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          if ($raw -notlike '*%USERPROFILE%\ci-canary*') {
            throw "the installer expanded or dropped other PATH entries: $raw"
          }
          if ($key.GetValueKind('Path') -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) {
            throw "PATH is no longer REG_EXPAND_SZ"
          }
          $key.Close()

      # The only step that talks to github.com, and the only one that covers the
      # -Version URL. What it really guards is the recovery: a download that
      # fails must not take a working install down with it.
      - name: A failed download leaves the existing install alone
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Pockode'
          $message = $null
          try {
            ./site/static/install.ps1 -Version 0.0.0-no-such-release
          } catch {
            $message = "$_"
          }
          if (-not $message) { throw "installing a version that does not exist should have failed" }
          if ($message -notlike '*/releases/download/v0.0.0-no-such-release/pockode-windows-amd64.exe*') {
            throw "the error did not name the URL it tried (or the tag lost its 'v'): $message"
          }
          if (-not (Test-Path (Join-Path $installDir 'pockode.exe'))) {
            throw "the failed install removed the working binary"
          }
          if (Test-Path (Join-Path $installDir 'pockode.exe.download')) {
            throw "a partial download was left behind"
          }

      # The sh side has covered this since it was written (see the
      # install-sh-version job): the version is pasted into a release URL, so
      # one containing a slash has to be refused before it gets there rather
      # than quietly fetching from elsewhere on github.com.
      - name: A version that is not a version is refused before any download
        run: |
          foreach ($bad in @('0.16.0/../../evil', '', 'a;b', '0.16.0 ')) {
            $message = $null
            try {
              ./site/static/install.ps1 -Version $bad
            } catch {
              $message = "$_"
            }
            if (-not $message) { throw "-Version '$bad' should have been refused" }
            if ($message -notlike '*Invalid version*' -and
                $message -notlike '*must not be empty*') {
              throw "-Version '$bad' was refused for the wrong reason: $message"
            }
            # The refusal has to come before the URL is built, not after a 404.
            if ($message -like '*github.com*') {
              throw "-Version '$bad' got as far as a download: $message"
            }
          }

      # The point of the checksum: a file that does not match the release is not
      # installed. Nothing here is rolled back - the check happens before the
      # download is renamed into place - so what has to hold is that the binary
      # never appears and the PATH is never touched. An install directory of its
      # own, both because it is not on PATH yet (against the default one, "PATH
      # unchanged" would hold no matter what the script did) and because
      # "nothing was installed" is then a statement about an empty directory.
      - name: A download that cannot be verified is refused
        run: |
          $custom = Join-Path $env:RUNNER_TEMP 'pockode-refused'

          function Get-RawUserPath {
            $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
            try {
              return [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            } finally {
              $key.Close()
            }
          }

          # $tag is the fixture release under test, $expected what stderr has to
          # say about it: the three failures need three different answers from
          # the user, so one wording standing in for another is a real defect.
          function Assert-Refused([string]$tag, [string]$expected) {
            Remove-Item -LiteralPath $custom -Recurse -Force -ErrorAction SilentlyContinue
            $pathBefore = Get-RawUserPath
            $message = $null
            try {
              ./site/static/install.ps1 -InstallDir $custom -Url "http://127.0.0.1:8000/download/$tag/pockode-windows-amd64.exe"
            } catch {
              $message = "$_"
            }

            # Checked before the wording and never skipped because of it: what
            # the user is owed here is an absent binary, and an assertion about
            # the message that returned early would hide its presence.
            if (Test-Path (Join-Path $custom 'pockode.exe')) {
              throw "[$tag] an unverified pockode.exe was installed to $custom"
            }
            # The directory itself, not just its contents: this run created it,
            # and a -InstallDir the user has never installed to should not be
            # left behind by an install that never happened.
            if (Test-Path -LiteralPath $custom) {
              $left = @(Get-ChildItem -LiteralPath $custom -Force)
              throw "[$tag] a refused install left ${custom} behind, holding: $($left.Name -join ', ')"
            }
            if ((Get-RawUserPath) -ne $pathBefore) {
              throw "[$tag] the user PATH was changed by a refused install: $(Get-RawUserPath)"
            }

            if (-not $message) { throw "[$tag] the install should have failed" }
            if ($message -notlike 'Nothing was installed:*') {
              throw "[$tag] the message does not start with 'Nothing was installed:': $message"
            }
            if ($message -notlike "*$expected*") {
              throw "[$tag] the message does not say '$expected': $message"
            }
            # -Url points at a mirror, not at a release, so the explanation
            # that only fits a default `latest` install cannot be true here.
            # Offering it anyway would hand the user an account of a mismatch
            # that cannot be true, for the one failure that is a security event.
            if ($message -like '*published mid-install*') {
              throw "[$tag] offered the latest-release explanation for a -Url install: $message"
            }
          }

          Assert-Refused 'v0.0.0-tampered' 'does not match the checksum'
          Assert-Refused 'v0.0.0-no-checksums' 'without checksums.txt'
          Assert-Refused 'v0.0.0-other-platform' 'does not list pockode-windows-amd64.exe'
          Remove-Item -LiteralPath $custom -Recurse -Force -ErrorAction SilentlyContinue

          # And the same over an install that is already there, which is what a
          # user actually stands to lose: the copy on disk has to still be the
          # one that was verified, not the download that was not.
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Pockode'
          $target = Join-Path $installDir 'pockode.exe'
          # Named, rather than left to fail inside Get-FileHash: without it a
          # broken install step turns up here as a missing-file error about a
          # path this step never installed to.
          if (-not (Test-Path $target)) { throw "expected an install from the earlier steps at $target" }
          $before = (Get-FileHash $target -Algorithm SHA256).Hash
          $message = $null
          try {
            ./site/static/install.ps1 -Url 'http://127.0.0.1:8000/download/v0.0.0-tampered/pockode-windows-amd64.exe'
          } catch {
            $message = "$_"
          }
          if (-not $message) { throw "the failed upgrade should have failed" }
          if ((Get-FileHash $target -Algorithm SHA256).Hash -ne $before) {
            throw "the working copy was replaced by a download that does not match its checksum"
          }
          foreach ($leftover in 'pockode.exe.download', 'pockode.exe.checksums') {
            if (Test-Path (Join-Path $installDir $leftover)) { throw "$leftover was left behind" }
          }

      # The other half of the checksum: a release that is fine has to install.
      # A parser stricter than the format costs the user an install and tells
      # them the release is broken, which is the one answer they can do nothing
      # about - and it would go unnoticed because every other assertion about
      # the checksum here is on a run that was supposed to fail.
      - name: A checksums.txt in the shapes other tools write it still verifies
        run: |
          $custom = Join-Path $env:RUNNER_TEMP 'pockode-odd'
          Remove-Item -LiteralPath $custom -Recurse -Force -ErrorAction SilentlyContinue
          ./site/static/install.ps1 -InstallDir $custom `
            -Url http://127.0.0.1:8000/download/v0.0.0-odd-checksums/pockode-windows-amd64.exe
          if (-not (Test-Path (Join-Path $custom 'pockode.exe'))) {
            throw "a valid release was refused: nothing was installed to $custom"
          }
          ./site/static/install.ps1 -Uninstall -InstallDir $custom

      # Also the documented `irm ... | iex` form, which turns the file into a
      # script block instead of running it as a script.
      - name: Install again (upgrade over the existing copy)
        run: |
          & ([scriptblock]::Create((Get-Content -Raw ./site/static/install.ps1))) -Url http://127.0.0.1:8000/pockode-windows-amd64.exe

          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Pockode'
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $raw = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.Close()
          $mine = @($raw -split ';' | Where-Object { $_.TrimEnd('\') -ieq $installDir.TrimEnd('\') })
          if ($mine.Count -ne 1) {
            throw "expected exactly one $installDir entry on PATH, found $($mine.Count): $raw"
          }

      - name: Uninstall
        run: ./site/static/install.ps1 -Uninstall

      - name: Verify the uninstall
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Pockode'
          if (Test-Path (Join-Path $installDir 'pockode.exe')) {
            throw "pockode.exe is still in $installDir"
          }
          # Nothing else was ever put there, so the directory itself should be gone.
          if (Test-Path $installDir) {
            throw "$installDir was left behind although it is empty"
          }

          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $raw = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.Close()
          if ($raw -split ';' | Where-Object { $_.TrimEnd('\') -ieq $installDir.TrimEnd('\') }) {
            throw "$installDir is still on PATH: $raw"
          }
          if ($raw -notlike '*%USERPROFILE%\ci-canary*') {
            throw "the uninstall took other PATH entries with it: $raw"
          }

      # -InstallDir is the one parameter a user has to keep repeating, and the
      # docs say why: the script only ever touches the directory it was told
      # about. Run last so it starts from a clean PATH and a clean default
      # location, and cleans up after itself.
      - name: A custom -InstallDir is installed to, and uninstalled from, on its own
        run: |
          $custom = Join-Path $env:RUNNER_TEMP 'pockode-custom'
          $default = Join-Path $env:LOCALAPPDATA 'Programs\Pockode'

          ./site/static/install.ps1 -InstallDir $custom -Url http://127.0.0.1:8000/pockode-windows-amd64.exe
          if (-not (Test-Path (Join-Path $custom 'pockode.exe'))) {
            throw "pockode.exe is not in $custom"
          }
          if (Test-Path $default) {
            throw "-InstallDir was given but the default location $default was used too"
          }

          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $raw = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.Close()
          if (-not ($raw -split ';' | Where-Object { $_.TrimEnd('\') -ieq $custom.TrimEnd('\') })) {
            throw "$custom did not land on the user PATH: $raw"
          }

          ./site/static/install.ps1 -Uninstall -InstallDir $custom
          if (Test-Path $custom) {
            throw "the uninstall left $custom behind although it is empty"
          }

          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $raw = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.Close()
          if ($raw -split ';' | Where-Object { $_.TrimEnd('\') -ieq $custom.TrimEnd('\') }) {
            throw "$custom is still on PATH: $raw"
          }
          if ($raw -notlike '*%USERPROFILE%\ci-canary*') {
            throw "the uninstall took other PATH entries with it: $raw"
          }

  # The Windows shells install.sh has to recognise are reached by faking uname
  # rather than by finding a real one: the windows runner has Git Bash but never
  # MSYS or Cygwin, and all four kernel spellings are the same branch. It returns
  # before touching anything, so this needs none of the real root the end-to-end
  # job sets up. What would otherwise break silently is the pattern itself: a
  # MINGW64_NT-* uname falling through to "Unsupported OS", or worse, matching
  # Linux and installing a binary the shell cannot run.
  git-bash-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: install.sh points Git Bash, MSYS and Cygwin at install.ps1
        run: |
          mkdir -p fake-bin
          # If the branch ever regresses into the Linux path, the script must not
          # be able to actually download and sudo-install on the runner - it has
          # to fail in a way the assertions below can name.
          printf '#!/bin/sh\necho "curl must not be reached on a Windows shell" >&2\nexit 99\n' > fake-bin/curl
          printf '#!/bin/sh\necho "sudo must not be reached on a Windows shell" >&2\nexit 99\n' > fake-bin/sudo
          chmod +x fake-bin/curl fake-bin/sudo
          for kernel in MINGW64_NT-10.0-26100 MINGW32_NT-6.2 MSYS_NT-10.0-19045 CYGWIN_NT-10.0; do
            printf '#!/bin/sh\necho %s\n' "$kernel" > fake-bin/uname
            chmod +x fake-bin/uname
            set +e
            output=$(PATH="$PWD/fake-bin:$PATH" sh site/static/install.sh 2>&1)
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "$kernel: install.sh should not report success on Windows"; exit 1
            fi
            case "$output" in
              *install.ps1*) ;;
              *) echo "$kernel: the message does not point at install.ps1: $output"; exit 1 ;;
            esac
            case "$output" in
              *Unsupported*) echo "$kernel: fell through to the unsupported-OS branch: $output"; exit 1 ;;
            esac
          done

  # The version a user asks for turns into a download URL, and getting that URL
  # wrong is the whole failure mode of this feature: a silently-latest install,
  # or a tag that lost its "v". Nothing here downloads anything - a fake curl
  # records the URL it was handed and fails, which stops the script before it
  # installs anything.
  install-sh-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Option parsing and what `echo` does to a backslash are exactly where the
    # shells a `curl ... | sh` can land in differ, and this job is all option
    # parsing. The end-to-end job covers the same three from the other side.
    strategy:
      fail-fast: false
      matrix:
        shell: [dash, bash, busybox ash]

    steps:
      - uses: actions/checkout@v6

      # busybox is not on the runner, and $SH is used unquoted below because
      # `busybox ash` is two words.
      - name: Run everything below under ${{ matrix.shell }}
        run: |
          command -v busybox >/dev/null || { sudo apt-get update; sudo apt-get install -y busybox-static; }
          echo 'SH=${{ matrix.shell }}' >> "$GITHUB_ENV"

      # On PATH for the rest of the job, so every step below runs install.sh
      # against the same fakes. Nothing after this point wants the real tools.
      # The uname is what pins the asset name the assertions expect; busybox ash
      # answers uname from its own applet without looking at PATH, so that leg
      # gets the runner's real linux/amd64, which is what the fake says anyway.
      - name: Fake curl, sudo and uname
        run: |
          mkdir -p fake-bin
          printf '#!/bin/sh\nfor a in "$@"; do echo "$a"; done >> "$CURL_LOG"\nexit 22\n' > fake-bin/curl
          printf '#!/bin/sh\necho "sudo must not be reached" >&2\nexit 99\n' > fake-bin/sudo
          printf '#!/bin/sh\ncase "$1" in -s) echo Linux ;; -m) echo x86_64 ;; esac\n' > fake-bin/uname
          chmod +x fake-bin/curl fake-bin/sudo fake-bin/uname
          echo "$PWD/fake-bin" >> "$GITHUB_PATH"
          echo "CURL_LOG=$PWD/curl.log" >> "$GITHUB_ENV"

      - name: install.sh resolves the requested version into a download URL
        run: |
          # $1 is what the download URL must contain, or "no-download" when the
          # script is expected to reject the input before reaching curl. The rest
          # is passed through to the script, so a leading VAR=value sets the
          # environment for that run only.
          expect() {
            wanted=$1
            shift
            : > "$CURL_LOG"
            set +e
            output=$(env "$@" 2>&1)
            status=$?
            set -e
            url=$(grep '^https://' "$CURL_LOG" || true)
            if [ "$status" -eq 0 ]; then
              echo "[$*] should not have reported success"; exit 1
            fi
            if [ "$wanted" = "no-download" ]; then
              if [ -n "$url" ]; then
                echo "[$*] should have been rejected before downloading, but fetched $url"; exit 1
              fi
              return 0
            fi
            case "$url" in
              *"$wanted"*) ;;
              *) echo "[$*] downloaded '$url', expected it to contain '$wanted'"; exit 1 ;;
            esac
            # Whatever went wrong, the user has to be able to see which URL it was.
            case "$output" in
              *"$url"*) ;;
              *) echo "[$*] the failure message does not name the URL: $output"; exit 1 ;;
            esac
          }

          asset=pockode-linux-amd64
          base=https://github.com/sijiaoh/pockode/releases

          # The old `curl ... | sh` has to keep installing the latest release.
          expect "$base/latest/download/$asset" $SH site/static/install.sh
          expect "$base/latest/download/$asset" POCKODE_VERSION=latest $SH site/static/install.sh
          # An empty value is how an unset variable of the user's own arrives.
          expect "$base/latest/download/$asset" POCKODE_VERSION= $SH site/static/install.sh

          # Both spellings of a version, through both ways of passing one.
          expect "$base/download/v0.12.1/$asset" POCKODE_VERSION=0.12.1 $SH site/static/install.sh
          expect "$base/download/v0.12.1/$asset" POCKODE_VERSION=v0.12.1 $SH site/static/install.sh
          expect "$base/download/v0.12.1/$asset" $SH site/static/install.sh --version 0.12.1
          expect "$base/download/v0.12.1/$asset" $SH site/static/install.sh --version=v0.12.1

          # An explicit flag overrides the environment rather than the reverse.
          expect "$base/download/v9.9.9/$asset" POCKODE_VERSION=0.12.1 $SH site/static/install.sh --version 9.9.9

          # A version is interpolated into a URL, so anything that could steer
          # the download elsewhere, or is plainly not a tag, stops the script.
          expect no-download $SH site/static/install.sh --version "0.12.1/../../evil"
          expect no-download $SH site/static/install.sh --version "http://example.com/x"
          expect no-download $SH site/static/install.sh --version ""
          expect no-download $SH site/static/install.sh --version
          expect no-download $SH site/static/install.sh --wat
          # A forgotten value must not be filled in by the next option.
          expect no-download $SH site/static/install.sh --version --help

          # Rejecting them is not enough. Left to themselves, a bare --version
          # dies on a message about `shift`, and --version --help on a 404 for
          # a release; neither tells the user what they actually got wrong.
          says_missing_value() {
            output=$($SH site/static/install.sh "$@" 2>&1 || true)
            case "$output" in
              *"Missing value for --version"*) ;;
              *) echo "[$*] did not say the value is missing: $output"; exit 1 ;;
            esac
          }
          says_missing_value --version
          says_missing_value --version --help

          # Reported back the way it was typed: dash's echo, and busybox ash's,
          # would turn the backslash in it into a line break.
          output=$($SH site/static/install.sh --version 'a\nb' 2>&1 || true)
          case "$output" in
            *'Invalid version: a\nb'*) ;;
            *) echo "the rejected version was not quoted back verbatim: $output"; exit 1 ;;
          esac

          # The version asked for has to appear in what the script says it is
          # doing - it is the one thing the user cannot check any other way
          # until the install finishes.
          output=$($SH site/static/install.sh --version 0.12.1 2>&1 || true)
          case "$output" in
            *"Downloading Pockode v0.12.1 for linux/amd64"*) ;;
            *) echo "a requested version is not named in the output: $output"; exit 1 ;;
          esac

          # The other side of that: a plain `curl ... | sh` still says exactly
          # what it always said, down to the wording.
          output=$($SH site/static/install.sh 2>&1 || true)
          case "$output" in
            "Downloading Pockode for linux/amd64..."*) ;;
            *) echo "the default run changed what it prints: $output"; exit 1 ;;
          esac

      - name: The documented pipe form accepts a version too
        run: |
          : > "$CURL_LOG"
          # Reading the script from stdin is the only form the docs give, and it
          # is the form that can break on its own: `sh -s --` has to leave the
          # script's stdin alone and still pass the arguments through.
          cat site/static/install.sh | $SH -s -- --version 0.12.1 || true
          if ! grep -q '^https://github.com/sijiaoh/pockode/releases/download/v0.12.1/pockode-linux-amd64$' "$CURL_LOG"; then
            echo "piping the script into sh -s -- --version did not reach the tagged URL: $(cat "$CURL_LOG")"; exit 1
          fi

      - name: --help explains both ways of asking for a version
        run: |
          output=$($SH site/static/install.sh --help)
          for form in 'POCKODE_VERSION=' 'sh -s -- --version'; do
            case "$output" in
              *"$form"*) ;;
              *) echo "--help does not mention $form: $output"; exit 1 ;;
            esac
          done

  # What install.sh does to a machine cannot be read off the script: that the
  # default install never asks for root, that what it prints afterwards sends
  # the user somewhere that works, that a download which fails or is interrupted
  # leaves a working install alone, and that nothing goes through a path someone
  # else could have got to first. So this installs the real binary for real, on
  # both platforms the script serves. Every run has a $HOME of its own, and the
  # runner's passwordless sudo stands in for a user's in the one case that is
  # meant to use it: a directory the user named and cannot write to.
  install-sh-install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon, so between them the two also cover both
        # spellings of the architecture the script maps.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/.go-version
          cache-dependency-path: server/go.sum

      # The real binary, not a stub: the install is only proven if what lands on
      # PATH runs and answers -version. The frontend is not built here - the
      # embed directories ship a .keep, which is all `go build` needs.
      - name: Build the release asset
        working-directory: server
        run: |
          asset=pockode-$(go env GOOS)-$(go env GOARCH)
          mkdir -p ../.ci-serve/latest/download
          go build -o "../.ci-serve/latest/download/$asset" .
          # The same "<hash>  <name>" line scripts/build.sh publishes, produced
          # the same way - by shasum on macOS, which has no sha256sum: the
          # install only proves anything if what it verifies against has the
          # shape a real release has.
          cd ../.ci-serve/latest/download
          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > checksums.txt
          else
            shasum -a 256 "$asset" > checksums.txt
          fi
          echo "ASSET_NAME=$asset" >> "$GITHUB_ENV"
          echo "PLATFORM=$(go env GOOS)/$(go env GOARCH)" >> "$GITHUB_ENV"

      # Three releases that must not install: one whose binary does not match
      # the checksum published for it, one that publishes no checksums.txt at
      # all, and one whose checksums.txt covers other platforms but not this
      # one. Laid out as tagged releases, so the tree the default run installs
      # from stays exactly what a real release looks like.
      - name: Add releases that cannot be verified to the served tree
        run: |
          fixture() {
            mkdir -p ".ci-serve/download/$1"
            cp ".ci-serve/latest/download/$ASSET_NAME" ".ci-serve/download/$1/"
          }

          # A byte appended after the checksum was taken is the same thing to
          # sha256 as a binary swapped for someone else's.
          fixture v0.0.0-tampered
          cp .ci-serve/latest/download/checksums.txt .ci-serve/download/v0.0.0-tampered/
          printf 'x' >> ".ci-serve/download/v0.0.0-tampered/$ASSET_NAME"

          # Deliberately nothing beside it: a release from before checksums
          # were published looks exactly like this.
          fixture v0.0.0-no-checksums

          # A platform neither leg of the matrix is.
          fixture v0.0.0-other-platform
          sed "s/$ASSET_NAME/pockode-plan9-amd64/" .ci-serve/latest/download/checksums.txt \
            > .ci-serve/download/v0.0.0-other-platform/checksums.txt

          # The odd one out: this release is fine and has to install. Its
          # checksums.txt is the same hashes in the three shapes a file not
          # written by scripts/build.sh can arrive in - a "*" in front of the
          # name, which is how shasum writes a hash it took in binary mode;
          # CRLF endings, which install.ps1 reads without noticing; and this
          # platform's line somewhere other than first. Refusing any of them
          # would be a rejection the message blames the release for. awk rather
          # than sed, which on macOS writes "\r" as a plain r.
          fixture v0.0.0-odd-checksums
          {
            printf '%064d  pockode-plan9-amd64\r\n' 0
            awk '{ printf "%s  *%s\r\n", $1, $2 }' .ci-serve/latest/download/checksums.txt
          } > .ci-serve/download/v0.0.0-odd-checksums/checksums.txt

      # The released asset does not exist until this branch ships, and pointing
      # the test at a real release would test GitHub rather than the script. The
      # served tree mirrors the release URL layout, so a tag that lost its "v"
      # still 404s here rather than quietly installing the latest build.
      - name: Serve the asset locally
        run: |
          # Logging to a file, not to the step's stderr: that pipe is closed
          # when this step ends, and the next request would then kill the server
          # halfway through the job.
          nohup python3 -m http.server 8000 --bind 127.0.0.1 --directory .ci-serve > http.log 2>&1 &
          url=http://127.0.0.1:8000/latest/download/$ASSET_NAME
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null "$url"; then exit 0; fi
            sleep 0.5
          done
          echo "the local file server never came up at $url"; exit 1

      # install.sh has no -Url of its own, so curl is the only seam. This is the
      # real curl with the release host swapped for the local server, which
      # leaves the URL the script builds under test, and it records where the
      # download was told to land - the only way to observe a temporary path
      # that the script deletes on its way out.
      - name: Fake curl that maps release URLs onto the local server
        run: |
          # The fake hands over by absolute path, so that it cannot find itself.
          test -x /usr/bin/curl
          mkdir -p ci-bin fake-bin fake-fail-bin
          # GNU stat on Linux, BSD stat on macOS: the one question both the
          # fake and the assertions ask of a file that the two answer apart.
          printf '#!/bin/sh\nstat -c %%a "$1" 2> /dev/null || stat -f %%Lp "$1"\n' > ci-bin/mode-of
          cat > fake-bin/curl <<'CURL'
          #!/bin/sh
          # Holds the download open for the interrupt cases below, and says so
          # first: a signal sent before the script reached curl would be testing
          # the shell's default handling instead of the script's trap.
          if [ -n "$FAKE_CURL_DELAY" ]; then
            : > "$FAKE_CURL_STARTED"
            sleep "$FAKE_CURL_DELAY"
          fi
          releases=https://github.com/sijiaoh/pockode/releases/
          # Rewriting one argument means rebuilding the whole list, and $n is
          # what stops the rotation from lapping onto what it just appended.
          n=$#
          while [ "$n" -gt 0 ]; do
            arg=$1
            shift
            case "$arg" in
              "$releases"*) arg="http://127.0.0.1:8000/${arg#"$releases"}" ;;
            esac
            set -- "$@" "$arg"
            n=$((n - 1))
          done
          prev=
          for arg in "$@"; do
            if [ "$prev" = -o ]; then
              printf '%s %s\n' "$("$MODE_OF" "$(dirname "$arg")")" "$arg" >> "$DOWNLOAD_LOG"
            fi
            prev=$arg
          done
          exec /usr/bin/curl "$@"
          CURL
          # The stream assertions need a run that fails without downloading: the
          # default run has no stderr to look at unless something goes wrong.
          printf '#!/bin/sh\nexit 22\n' > fake-fail-bin/curl
          chmod +x ci-bin/mode-of fake-bin/curl fake-fail-bin/curl
          echo "$PWD/fake-bin" >> "$GITHUB_PATH"
          echo "MODE_OF=$PWD/ci-bin/mode-of" >> "$GITHUB_ENV"
          echo "DOWNLOAD_LOG=$PWD/download.log" >> "$GITHUB_ENV"
          echo "FAKE_CURL_STARTED=$PWD/curl-started" >> "$GITHUB_ENV"

      # Every step below runs the same shells against the same clean slate, and
      # a copy of either that drifted would quietly stop testing one of them.
      - name: The shells, and the helpers every step below shares
        run: |
          if [ "$(uname -s)" = Linux ]; then
            command -v busybox >/dev/null || { sudo apt-get update; sudo apt-get install -y busybox-static; }
          fi
          # Owned by root, and so the one place a user's install needs sudo for;
          # SYSTEM_DIR below is created and removed inside it.
          sudo mkdir -p /opt/pockode-ci

          # Records being run and fails. The exit is loud rather than a quiet
          # refusal, so a script that reached it cannot pass on a cleanup that
          # happened to work.
          mkdir -p fake-sudo-bin
          printf '#!/bin/sh\nprintf "%%s\\n" "$*" >> "$SUDO_LOG"\nexit 99\n' > fake-sudo-bin/sudo
          chmod +x fake-sudo-bin/sudo

          cat > ci-lib.sh <<'LIB'
          # To the step's own stderr, kept on fd 3: a check that fails inside a
          # run whose stderr goes to a file would otherwise say why into it.
          exec 3>&2
          fail() { printf '%s\n' "FAIL [$SH]: $*" >&3; exit 1; }

          # `curl ... | sh` lands in whatever /bin/sh is: across the Linux
          # distributions at least dash, bash and busybox ash; on macOS bash 3.2
          # in POSIX mode, or dash where /var/select/sh was switched to it.
          # `busybox ash` is two words, so callers run $SH unquoted.
          if [ "$(uname -s)" = Darwin ]; then
            for_each_shell() { for SH in sh dash bash; do "$@"; done; }
          else
            for_each_shell() { for SH in dash bash 'busybox ash'; do "$@"; done; }
          fi

          # Absolute, so that a step can run the script from another directory.
          SCRIPT=$PWD/site/static/install.sh
          ASSET=$PWD/.ci-serve/latest/download/$ASSET_NAME
          FAKE_SUDO_BIN=$PWD/fake-sudo-bin
          export SUDO_LOG=$PWD/sudo.log

          # A home of its own, emptied before every run: the default goes to
          # ~/.local/bin, and neither what an earlier run left there nor
          # anything the runner keeps in its own home can decide a result.
          export HOME=$PWD/ci-home
          DEFAULT_DIR=$HOME/.local/bin
          # The PATH of a user who has not added ~/.local/bin to it yet, and the
          # PATH of one who has - the second is the default here, because most
          # steps are about the install rather than about PATH advice.
          BASE_PATH=$PATH
          export PATH="$DEFAULT_DIR:$BASE_PATH"

          # Root-owned, which is where /usr/local/bin is on Linux. Not
          # /usr/local/bin itself: a macOS runner can have made that writable
          # to its user, and which answer the script gives depends on it.
          SYSTEM_DIR=/opt/pockode-ci/bin

          # The two paths the script used to use, kept here because several
          # steps have to show that nothing goes to either any more: the
          # download's, and the staged copy's before it got an unguessable name.
          # Where mktemp creates things: the shared directory the download has
          # to end up in a private subdirectory of, rather than directly in.
          TMPBASE=${TMPDIR:-/tmp}
          TMPBASE=${TMPBASE%/}
          PREDICTABLE=/tmp/pockode
          # The same fixed name under TMPDIR, which a macOS runner sets: as
          # predictable as /tmp's, and where a regression would write instead.
          PREDICTABLE_TMPDIR=$TMPBASE/pockode
          PREDICTABLE_STAGED=$SYSTEM_DIR/pockode.download

          # Runs start from nothing installed, so no step can pass on what an
          # earlier one left behind.
          reset_install() {
            rm -rf "$HOME"
            mkdir -p "$HOME"
            sudo rm -rf "$SYSTEM_DIR"
            rm -rf "$PREDICTABLE" "$PREDICTABLE_TMPDIR" "$TMPBASE"/pockode-install.*
            : > "$DOWNLOAD_LOG"
          }

          # Read from stdin, the way `curl ... | sh -s -- ...` hands it over.
          # Every run through here is also the proof that it never asks for
          # root: sudo is the fake, and a run that reached it fails here even if
          # the script carried on regardless. 98 rather than fail's 1: called in
          # a subshell, this exit only ends the subshell, and 1 is the status a
          # refusal test is waiting for.
          install_sh() {
            : > "$SUDO_LOG"
            run_status=0
            PATH="$FAKE_SUDO_BIN:$PATH" $SH -s -- "$@" < "$SCRIPT" || run_status=$?
            if [ -s "$SUDO_LOG" ]; then
              printf '%s\n' "FAIL [$SH]: [$*] reached sudo: $(cat "$SUDO_LOG")" >&3
              exit 98
            fi
            return "$run_status"
          }

          # The one install that is meant to reach sudo, and it gets the real one.
          sudo_install_sh() { $SH -s -- --install-dir "$SYSTEM_DIR" "$@" < "$SCRIPT"; }

          # A PATH holding every tool install.sh and the fake curl run and
          # nothing else, less the ones named: the only way to take a tool away
          # from `command -v`. The single difference from a working machine is
          # then the tool taken away, so a script that got past its absence
          # would be caught by the assertions rather than die of some other
          # missing tool and look the same. A tool added to install.sh later and
          # not added here fails loudly as a 127, which is the right way round.
          # Shells and hash tools a platform does not have are simply left out.
          path_without() {
            dir=$PWD/path-without-$(printf '%s' "$*" | tr ' ' -)
            rm -rf "$dir"
            mkdir -p "$dir"
            for tool in sh dash bash busybox uname mktemp rm awk sudo cp chmod mv \
              dirname mkdir sed cat stat sha256sum shasum; do
              case " $* " in *" $tool "*) continue ;; esac
              found=$(command -v "$tool") || continue
              ln -s "$found" "$dir/$tool"
            done
            ln -s "$PWD/fake-bin/curl" "$dir/curl"
            printf '%s' "$dir"
          }

          # busybox ash resolves sha256sum as one of its own applets without
          # consulting PATH, the way it does uname, so there the tool cannot be
          # taken away - which is also why busybox needs no fallback. Asked
          # rather than assumed, like the uname branches. $1 is the PATH the
          # tool was taken out of.
          shell_keeps_sha256sum() {
            if PATH=$1 $SH -c 'command -v sha256sum' > /dev/null 2>&1; then
              echo "$SH answers sha256sum itself; leaving this branch to the other shells"
              return 0
            fi
            return 1
          }

          # $1 defaults to the default install.
          assert_installed() {
            target=${1:-$DEFAULT_DIR/pockode}
            if [ -L "$target" ]; then fail "$target is a symlink"; fi
            [ -f "$target" ] || fail "$target is not a regular file"
            mode=$("$MODE_OF" "$target")
            [ "$mode" = 755 ] || fail "$target is mode $mode, not 755"
            cmp -s "$ASSET" "$target" || fail "$target is not the asset that was served"
            # Quiet: this runs a few dozen times, and a failure has fail to
            # speak through.
            "$target" -version > /dev/null || fail "the installed $target does not run"
          }

          # Installed with sudo, owned by root, and runnable by users other than
          # the one who installed it: nothing but the explicit chmod on the
          # staged copy makes the last true. Only asked of this directory - a
          # home directory need not let other users in at all.
          assert_system_install() {
            assert_installed "$SYSTEM_DIR/pockode"
            owner=$(ls -ld "$SYSTEM_DIR/pockode" | awk '{ print $3 }')
            [ "$owner" = root ] || fail "$SYSTEM_DIR/pockode is owned by $owner, not root"
            sudo -u nobody "$SYSTEM_DIR/pockode" -version > /dev/null ||
              fail "a user who did not install it cannot run $SYSTEM_DIR/pockode"
          }

          # By shape, not by name: the staged copy is called something different
          # every run, so there is no one path to look for. Any directories
          # given are searched besides the two every step installs to.
          assert_no_leftovers() {
            staged=$(find "$DEFAULT_DIR" "$SYSTEM_DIR" "$@" -maxdepth 1 -name 'pockode.*' 2> /dev/null || :)
            [ -z "$staged" ] || fail "a staged file was left behind: $staged"
            # The slash is for macOS, where /tmp is a symlink and BSD find
            # would otherwise list the link and nothing behind it.
            leftover=$(find "$TMPBASE/" -maxdepth 1 -name 'pockode-install.*')
            [ -z "$leftover" ] || fail "a temporary directory was left behind: $leftover"
          }

          # Where the last download of the binary was told to land, and the
          # mode of the directory it was in, both as recorded by the fake curl.
          # The binary's line and not the checksums file's: each run fetches
          # both, and it is the binary that has to land somewhere private.
          download_path() { awk '$2 ~ /\/pockode$/ { p = $2 } END { print p }' "$DOWNLOAD_LOG"; }
          download_dir_mode() { awk '$2 ~ /\/pockode$/ { m = $1 } END { print m }' "$DOWNLOAD_LOG"; }
          LIB

      # A first install on a machine that has never had ~/.local/bin: it is not
      # on PATH, so what is printed last is the only way the user finds what
      # was installed. Compared in full and then followed the way a user would:
      # the printed line is run, a fresh shell reads the startup file it wrote,
      # and the `pockode` that shell finds has to be this install.
      - name: A first install needs no sudo and says how to put it on PATH
        run: |
          . ./ci-lib.sh
          target=$DEFAULT_DIR/pockode
          # macOS terminals start login shells, which read .bash_profile rather
          # than .bashrc.
          if [ "$(uname -s)" = Darwin ]; then bash_rc=.bash_profile; else bash_rc=.bashrc; fi
          # $1 is the login shell, $2 the startup file the advice has to write.
          check_login_shell() {
            reset_install
            ( PATH=$BASE_PATH; export SHELL="/bin/$1"; install_sh ) > out.txt 2> err.txt ||
              fail "[$1] the install failed: $(cat err.txt)"
            {
              echo "Downloading Pockode for $PLATFORM..."
              echo "Installing to $target..."
              echo
              echo "$DEFAULT_DIR is not on your PATH. To add it, run:"
              echo "  echo 'export PATH=\"\$HOME/.local/bin:\$PATH\"' >> ~/$2"
              echo "and open a new terminal."
              echo
              echo "Done! Until 'pockode' finds this copy, start it with its full path:"
              echo "  $target -password YOUR_PASSWORD"
            } > wanted.txt
            diff -u wanted.txt out.txt || fail "[$1] a first install does not print what it should"
            [ ! -s err.txt ] || fail "[$1] a first install wrote to stderr: $(cat err.txt)"
            assert_installed
            assert_no_leftovers

            ( PATH=$BASE_PATH; sh -c "$(sed -n 5p out.txt)" ) || fail "[$1] the printed PATH command failed"
            found=$(PATH=$BASE_PATH sh -c '. "$HOME/$1" && command -v pockode' sh "$2" || :)
            [ "$found" = "$target" ] ||
              fail "[$1] after following the advice, 'pockode' is '$found', not $target"
          }
          check() {
            check_login_shell zsh .zshrc
            check_login_shell bash "$bash_rc"
            check_login_shell sh .profile

            # fish is not on either runner, so its advice is checked as text.
            reset_install
            ( PATH=$BASE_PATH; export SHELL=/usr/bin/fish; install_sh ) > out.txt 2> err.txt ||
              fail "[fish] the install failed: $(cat err.txt)"
            [ "$(sed -n 5p out.txt)" = "  fish_add_path $DEFAULT_DIR" ] ||
              fail "[fish] the advice is not fish_add_path: $(cat out.txt)"
          }
          for_each_shell check

      # Once ~/.local/bin is on PATH every later run is an upgrade, and its
      # output is what nearly every user sees from then on. Compared in full:
      # most other assertions here look at a run that failed, so an extra line,
      # or a reworded one, would go unnoticed.
      - name: An upgrade replaces the existing install
        run: |
          . ./ci-lib.sh
          check() {
            reset_install
            mkdir -p "$DEFAULT_DIR"
            printf '#!/bin/sh\necho "pockode (old)"\n' > "$DEFAULT_DIR/pockode"
            chmod 755 "$DEFAULT_DIR/pockode"
            # Under a restrictive umask the download is readable by the user
            # who ran the script and no one else, which is where installing it
            # by moving it into place leaves a binary of the wrong mode.
            (umask 077; install_sh) > out.txt 2> err.txt || fail "the upgrade failed: $(cat err.txt)"
            printf '%s\n' "Downloading Pockode for $PLATFORM..." \
              "Installing to $DEFAULT_DIR/pockode..." \
              "Done! Run 'pockode -password YOUR_PASSWORD' to get started." > wanted.txt
            diff -u wanted.txt out.txt || fail "an upgrade changed what it prints"
            [ ! -s err.txt ] || fail "an upgrade wrote to stderr: $(cat err.txt)"
            assert_installed
            assert_no_leftovers
            # The step's bash remembers where it last found pockode.
            hash -r
            [ "$(command -v pockode)" = "$DEFAULT_DIR/pockode" ] || fail "'pockode' is $(command -v pockode)"
            pockode -version > /dev/null || fail "'pockode -version' does not run the upgrade"
          }
          for_each_shell check

      # Everyone who installed before ~/.local/bin was the default has pockode
      # in /usr/local/bin, which comes before anything a user adds to PATH:
      # without a warning, every upgrade from then on installs a copy that never
      # runs. The warning is compared in full and its advice followed, after
      # which the next run has nothing left to warn about.
      - name: An older copy that comes first on PATH is warned about
        run: |
          . ./ci-lib.sh
          # $1 is the directory, $2 "sudo" when it needs it.
          old_copy() {
            printf '#!/bin/sh\necho "pockode (old)"\n' > old-pockode
            $2 mkdir -p "$1"
            $2 cp old-pockode "$1/pockode"
            $2 chmod 755 "$1/pockode"
          }
          # $1 is the directory holding the old copy, $2 the command that
          # removes it, $3 the rest of PATH.
          expect_warning() {
            ( PATH="$1:$3"; install_sh ) > out.txt 2> err.txt || fail "[$1] the install failed: $(cat err.txt)"
            {
              echo
              echo "Warning: 'pockode' runs $1/pockode, not the copy just installed at $DEFAULT_DIR/pockode."
              echo "It comes first on your PATH, so it will keep running instead of this one."
              echo "If it is an older install, remove it with:"
              echo "  $2 $1/pockode"
            } > wanted.txt
            diff -u wanted.txt err.txt || fail "[$1] the warning is not the one expected"
            assert_installed
            # Until then, the full path is the way to the new copy.
            grep -qxF "  $DEFAULT_DIR/pockode -password YOUR_PASSWORD" out.txt ||
              fail "[$1] the full path to the new copy is not given: $(cat out.txt)"

            ( PATH="$1:$3"; sh -c "$(tail -n 1 err.txt)" ) || fail "[$1] the printed removal failed"
            [ ! -e "$1/pockode" ] || fail "[$1] the printed removal left the old copy"
            ( PATH="$1:$3"; install_sh ) > out.txt 2> err.txt || fail "[$1] the install failed: $(cat err.txt)"
            [ ! -s err.txt ] || fail "[$1] still warns once the old copy is gone: $(cat err.txt)"
            assert_installed
            assert_no_leftovers
          }
          check() {
            # Upgrading from the previous install.sh: a root-owned copy on the
            # default PATH, and ~/.local/bin nowhere on it yet.
            reset_install
            old_copy "$SYSTEM_DIR" sudo
            expect_warning "$SYSTEM_DIR" "sudo rm" "$BASE_PATH"

            # A copy the user put in a directory of their own, ahead of a
            # ~/.local/bin that is already on PATH.
            reset_install
            old_copy "$HOME/old-bin"
            expect_warning "$HOME/old-bin" rm "$PATH"
          }
          for_each_shell check

      # Every way of naming a directory lands the install there and nowhere
      # else - not also in ~/.local/bin - and one the user can write to is
      # installed without sudo, exactly like the default.
      - name: An install directory of the user's choosing is installed to
        run: |
          . ./ci-lib.sh
          # $1 is the directory the install has to land in; the rest is passed
          # to install_sh.
          lands_in() {
            want=$1
            shift
            install_sh "$@" > out.txt 2> err.txt || fail "[$*] the install failed: $(cat err.txt)"
            grep -qxF "Installing to $want/pockode..." out.txt || fail "[$*] did not install to $want: $(cat out.txt)"
            assert_installed "$want/pockode"
            assert_no_leftovers "$want"
            [ ! -e "$DEFAULT_DIR" ] || fail "[$*] created $DEFAULT_DIR as well"
          }
          check() {
            reset_install
            lands_in "$HOME/a/bin" --install-dir "$HOME/a/bin"
            reset_install
            lands_in "$HOME/b/bin" --install-dir="$HOME/b/bin/"
            reset_install
            ( export POCKODE_INSTALL_DIR="$HOME/c/bin"; lands_in "$HOME/c/bin" )
            # The flag wins over the environment.
            reset_install
            ( export POCKODE_INSTALL_DIR="$HOME/not-here"; lands_in "$HOME/d/bin" --install-dir "$HOME/d/bin" )
            [ ! -e "$HOME/not-here" ] || fail "POCKODE_INSTALL_DIR was used over --install-dir"
            # A tilde the shell leaves alone - after an =, and inside quotes -
            # is the user's home all the same, not a directory named "~".
            reset_install
            # shellcheck disable=SC2088
            lands_in "$HOME/e/bin" --install-dir='~/e/bin'
            reset_install
            # shellcheck disable=SC2088
            ( export POCKODE_INSTALL_DIR='~/f/bin'; lands_in "$HOME/f/bin" )
            # Relative to where it was run.
            reset_install
            ( cd "$HOME"; lands_in "$HOME/g/bin" --install-dir g/bin )

            # A path that is a file cannot be installed into.
            reset_install
            : > "$HOME/a-file"
            status=0
            install_sh --install-dir "$HOME/a-file" > out.txt 2> err.txt || status=$?
            [ "$status" = 1 ] || fail "installing into a file exited $status, wanted 1"
            grep -qxF "Nothing was installed: $HOME/a-file exists and is not a directory." err.txt ||
              fail "installing into a file does not say why: $(cat err.txt)"

            # The default is ~/.local/bin, which means nothing without a home,
            # and that is found out before anything is downloaded.
            reset_install
            status=0
            ( unset HOME; install_sh ) > out.txt 2> err.txt || status=$?
            [ "$status" = 1 ] || fail "an install without HOME exited $status, wanted 1"
            grep -qF 'Cannot find your home directory' err.txt ||
              fail "an install without HOME does not say why: $(cat err.txt)"
            [ ! -s "$DOWNLOAD_LOG" ] || fail "an install without HOME downloaded: $(cat "$DOWNLOAD_LOG")"
          }
          for_each_shell check

      # The one install that is meant to use sudo: a directory the user named
      # and cannot write to. Asked for before anything is written, and only
      # there - see the refusal steps below for the other half.
      - name: A directory the user cannot write to is installed with sudo, for every user
        run: |
          . ./ci-lib.sh
          check() {
            reset_install
            sudo_install_sh > out.txt 2> err.txt || fail "the install failed: $(cat err.txt)"
            grep -qxF "You cannot write to $SYSTEM_DIR, so installing there needs sudo." out.txt ||
              fail "the install did not say why it needs sudo: $(cat out.txt)"
            assert_system_install
            # Also the upgrade case, under the umask where only the explicit
            # chmod leaves the rest of the machine able to run it.
            (umask 077; sudo_install_sh) > /dev/null || fail "the upgrade failed"
            assert_system_install
            assert_no_leftovers
            [ ! -e "$DEFAULT_DIR" ] || fail "created $DEFAULT_DIR as well"

            # Without a sudo to fall back on, it is refused and says why.
            reset_install
            status=0
            PATH=$(path_without sudo) $SH -s -- --install-dir "$SYSTEM_DIR" < "$SCRIPT" > out.txt 2> err.txt || status=$?
            [ "$status" = 1 ] || fail "an install without sudo exited $status, wanted 1"
            grep -qF "you cannot write to $SYSTEM_DIR, and sudo is not available" err.txt ||
              fail "an install without sudo does not say why: $(cat err.txt)"
            [ ! -e "$SYSTEM_DIR/pockode" ] || fail "an install without sudo installed anyway"
          }
          for_each_shell check

      # What the default promises is that it never needs root, including when
      # it cannot write where it wants to - usually a ~/.local some earlier sudo
      # created. It says which directory is in the way and how to take it back,
      # and the advice is followed to show that it is enough.
      - name: The default refuses rather than use sudo, and says how to fix it
        run: |
          . ./ci-lib.sh
          check() {
            reset_install
            sudo mkdir -p "$HOME/.local"
            status=0
            install_sh > out.txt 2> err.txt || status=$?
            [ "$status" = 1 ] || fail "an install into a root-owned ~/.local exited $status, wanted 1"
            {
              echo "Nothing was installed: you cannot write to $HOME/.local."
              echo "It is usually left behind by an earlier command run with sudo. Take it back with:"
              echo "  sudo chown -R \"\$(id -un)\" $HOME/.local"
              echo "or install somewhere else with --install-dir."
            } > wanted.txt
            diff -u wanted.txt err.txt || fail "the refusal is not the one expected"
            [ ! -e "$DEFAULT_DIR" ] || fail "$DEFAULT_DIR was created anyway"
            assert_no_leftovers

            sh -c "$(sed -n 3p err.txt)" || fail "the printed chown failed"
            install_sh > /dev/null || fail "after taking ~/.local back, the install still failed"
            assert_installed
          }
          for_each_shell check

      # A fixed /tmp/pockode is a path any other user on the machine can create,
      # or point somewhere of their choosing, before the install runs.
      - name: The download lands somewhere private and unpredictable
        run: |
          . ./ci-lib.sh
          check() {
            reset_install
            install_sh > /dev/null
            first=$(download_path)
            mode=$(download_dir_mode)
            dir=$(dirname "$first")
            case "$dir" in
              "$TMPBASE"|/tmp|/var/tmp|/) fail "the download went straight into $dir" ;;
            esac
            [ "$mode" = 700 ] || fail "the download directory $dir is mode $mode, not 700"

            install_sh > /dev/null
            [ "$first" != "$(download_path)" ] || fail "two runs downloaded to the same path $first"
            assert_no_leftovers
          }
          for_each_shell check

      - name: A planted /tmp/pockode is not written through
        run: |
          . ./ci-lib.sh
          check() {
            reset_install
            printf 'someone else\n' > canary
            # -f: on Linux the two are one path.
            ln -sf "$PWD/canary" "$PREDICTABLE"
            ln -sf "$PWD/canary" "$PREDICTABLE_TMPDIR"
            install_sh > /dev/null
            assert_installed
            assert_no_leftovers
            [ -L "$PREDICTABLE" ] || fail "$PREDICTABLE is no longer the symlink it was"
            [ -L "$PREDICTABLE_TMPDIR" ] || fail "$PREDICTABLE_TMPDIR is no longer the symlink it was"
            grep -q 'someone else' canary || fail "the download was written through a planted symlink"
          }
          for_each_shell check

      # /usr/local/bin is root-only on Linux but group-writable on a default
      # macOS, where anyone in the admin group can leave a symlink at a staged
      # name they can predict and have an install someone runs with sudo follow
      # it as root. Planted in a loop, the way it would be for real: deleting
      # the name before writing to it leaves a gap between the two commands that
      # this wins on the first install, so only a name that cannot be guessed
      # passes this.
      - name: The staged name cannot be planted, not even in a loop
        run: |
          . ./ci-lib.sh
          # An assertion that fires leaves the step without reaching the line
          # that stops the loop, and a root-owned spin left running would follow
          # the job into every step after this one.
          trap 'rm -f plant-flag' EXIT
          check() {
            reset_install
            sudo mkdir -p "$SYSTEM_DIR"
            printf 'someone else\n' > canary
            # Standing in for a user who can write $SYSTEM_DIR - it is
            # root-only, so reaching it at all needs sudo here. The flag file
            # stops the loop: killing it by pid would only reach the sudo.
            : > plant-flag
            sudo sh -c 'while [ -e "$1" ]; do ln -sfn "$2" "$3"; done' \
              plant "$PWD/plant-flag" "$PWD/canary" "$PREDICTABLE_STAGED" &
            # A loop that never planted anything would pass everything below.
            waited=0
            until sudo test -L "$PREDICTABLE_STAGED"; do
              waited=$((waited + 1))
              [ "$waited" -lt 100 ] || fail "nothing was ever planted at $PREDICTABLE_STAGED"
              sleep 0.1
            done
            attempt=0
            while [ "$attempt" -lt 5 ]; do
              sudo_install_sh > /dev/null || fail "the install failed"
              assert_system_install
              grep -q 'someone else' canary ||
                fail "the install was written through a symlink planted at $PREDICTABLE_STAGED"
              attempt=$((attempt + 1))
            done
            rm -f plant-flag
            wait
            sudo rm -f "$PREDICTABLE_STAGED"
            assert_no_leftovers
          }
          for_each_shell check

      # The twin of the install.ps1 case above: a tag that was never released
      # 404s on the local server, so this is a download that really fails
      # halfway through the run rather than one told to fail.
      - name: A failed download leaves the existing install alone
        run: |
          . ./ci-lib.sh
          check() {
            reset_install
            # This order: the other way round, the default copy would already
            # be ahead of $SYSTEM_DIR on PATH and draw a warning.
            sudo_install_sh > /dev/null
            install_sh > /dev/null
            if install_sh --version 0.0.0-no-such-release 2> /dev/null; then
              fail "installing a version that does not exist should have failed"
            fi
            if install_sh --install-dir "$SYSTEM_DIR" --version 0.0.0-no-such-release 2> /dev/null; then
              fail "installing a version that does not exist into $SYSTEM_DIR should have failed"
            fi
            assert_installed
            assert_system_install
            assert_no_leftovers
          }
          for_each_shell check

      # The point of the checksum: a file that does not match the release is not
      # installed, and that is decided before anything asks for root - so it
      # holds for a directory that would need sudo too, where install_sh's fake
      # sudo fails any run that reached it.
      - name: A download that cannot be verified is refused, and sudo is never reached
        run: |
          . ./ci-lib.sh
          # $1 is the fixture release under test, $2 what stderr has to say
          # about it - the three failures need three different answers from the
          # user, so one wording standing in for another is a real defect. $3 is
          # the install that has to survive it, and the rest goes to install_sh.
          refuses() {
            release=$1
            says=$2
            survivor=$3
            shift 3
            status=0
            install_sh "$@" --version "$release" > out.txt 2> err.txt || status=$?
            [ "$status" = 1 ] || fail "[$release $*] exited $status, wanted 1"
            grep -qF "$says" err.txt || fail "[$release $*] stderr does not say '$says': $(cat err.txt)"
            # These are named versions, where the binary and the checksums came
            # from one release by construction. Offering the mid-install
            # explanation here would hand the user an account of a mismatch
            # that cannot be true, for the one failure that is a security event.
            if grep -qF 'published mid-install' err.txt; then
              fail "[$release $*] offered the latest-release explanation for a named version: $(cat err.txt)"
            fi
            if grep -q 'Installing to' out.txt; then fail "[$release $*] said it was installing: $(cat out.txt)"; fi
            # The install that was already there is what a user stands to lose.
            assert_installed "$survivor"
            assert_no_leftovers
          }
          refuses_everywhere() {
            refuses "$1" "$2" "$DEFAULT_DIR/pockode"
            refuses "$1" "$2" "$SYSTEM_DIR/pockode" --install-dir "$SYSTEM_DIR"
          }

          check() {
            reset_install
            # Into $SYSTEM_DIR first, for the reason in the step above.
            sudo_install_sh > /dev/null || fail "the install into $SYSTEM_DIR failed"
            install_sh > /dev/null || fail "the install failed"
            refuses_everywhere 0.0.0-tampered 'does not match the checksum'
            refuses_everywhere 0.0.0-no-checksums 'without checksums.txt'
            refuses_everywhere 0.0.0-other-platform "does not list $ASSET_NAME"
          }
          for_each_shell check

      # The other half of the checksum: a release that is fine has to install.
      # A parser that is stricter than the format costs the user an install and
      # tells them the release is broken, which is the one answer they can do
      # nothing about - and the reason it would go unnoticed is that every other
      # assertion here is about a run that was supposed to fail.
      - name: A checksums.txt in the shapes other tools write it still verifies
        run: |
          . ./ci-lib.sh
          check() {
            reset_install
            install_sh --version 0.0.0-odd-checksums > out.txt 2> err.txt ||
              fail "a valid release was refused: $(cat err.txt)"
            assert_installed
            assert_no_leftovers
          }
          for_each_shell check

      # A machine with no way to check the download does not get an install it
      # cannot check: refusing is the whole difference between a checksum and a
      # decoration. Nothing is fetched either - the tools are looked for before
      # the download rather than after it.
      - name: Without sha256sum or shasum nothing is downloaded or installed
        run: |
          . ./ci-lib.sh
          check() {
            no_sha=$(path_without sha256sum shasum)
            if shell_keeps_sha256sum "$no_sha"; then return 0; fi
            reset_install
            status=0
            ( PATH=$no_sha; install_sh ) > out.txt 2> err.txt || status=$?
            [ "$status" = 1 ] || fail "a machine without a sha256 tool exited $status, wanted 1"
            grep -qF 'neither sha256sum nor shasum' err.txt ||
              fail "stderr does not name the missing tools: $(cat err.txt)"
            [ ! -e "$DEFAULT_DIR/pockode" ] || fail "pockode was installed without being verified"
            [ ! -s "$DOWNLOAD_LOG" ] || fail "something was downloaded anyway: $(cat "$DOWNLOAD_LOG")"
            assert_no_leftovers
          }
          for_each_shell check

      # shasum is all macOS has, and on Linux it is the fallback, so it has to
      # verify on both: taken down to shasum alone, a good release installs and
      # a tampered one is refused.
      - name: With shasum alone the download is still verified
        run: |
          . ./ci-lib.sh
          check() {
            shasum_only=$(path_without sha256sum)
            if shell_keeps_sha256sum "$shasum_only"; then return 0; fi
            reset_install
            ( PATH=$shasum_only; install_sh ) > out.txt 2> err.txt ||
              fail "with shasum alone, a valid release was refused: $(cat err.txt)"
            assert_installed
            status=0
            ( PATH=$shasum_only; install_sh --version 0.0.0-tampered ) > out.txt 2> err.txt || status=$?
            [ "$status" = 1 ] || fail "with shasum alone, a tampered release exited $status, wanted 1"
            grep -qF 'does not match the checksum' err.txt ||
              fail "with shasum alone, a tampered release was not refused for its checksum: $(cat err.txt)"
            assert_installed
            assert_no_leftovers
          }
          for_each_shell check

      # An interrupted download is the one failure no error handling around the
      # curl call can see, so the cleanup and the exit status come from traps.
      # Ctrl-C signals the whole foreground process group, and that shape is the
      # only one that reaches them: a `cmd &` in a non-interactive shell
      # inherits SIGINT ignored, and POSIX then makes the trap a no-op too, so
      # the obvious way to write this test passes whatever the script does.
      - name: An interrupted download leaves the existing install alone
        run: |
          . ./ci-lib.sh
          cat > signal-run.py <<'PY'
          import os, signal, subprocess, sys, time

          name, marker, *command = sys.argv[1:]
          if os.path.exists(marker):
              os.remove(marker)
          child = subprocess.Popen(command, start_new_session=True)
          deadline = time.monotonic() + 60
          while not os.path.exists(marker):
              if child.poll() is not None:
                  sys.exit(f"the script exited ({child.returncode}) before the download started")
              if time.monotonic() > deadline:
                  child.kill()
                  sys.exit("the download never started")
              time.sleep(0.05)
          os.killpg(os.getpgid(child.pid), getattr(signal, name))
          status = child.wait()
          # A shell that died from the signal rather than running its trap is a
          # different outcome from one that exited 128+signo, so do not report it
          # as the same number.
          sys.exit(status if status >= 0 else 200 - status)
          PY
          check() {
            reset_install
            install_sh > /dev/null
            for signal in SIGHUP:129 SIGINT:130 SIGTERM:143; do
              status=0
              FAKE_CURL_DELAY=60 python3 signal-run.py "${signal%:*}" "$FAKE_CURL_STARTED" \
                $SH "$SCRIPT" > /dev/null || status=$?
              [ "$status" = "${signal#*:}" ] ||
                fail "${signal%:*} during the download exited $status, wanted ${signal#*:}"
              assert_installed
              assert_no_leftovers
            done
          }
          for_each_shell check

      # The failure messages have to be on stderr - a user who sends stdout
      # somewhere still has to be told why nothing installed - and the progress
      # lines have to stay on stdout. The assertions in the jobs above merge the
      # two with 2>&1 and cannot tell them apart.
      - name: Failures go to stderr and progress stays on stdout
        run: |
          . ./ci-lib.sh
          fake_uname() {
            mkdir -p fake-uname-bin
            printf '#!/bin/sh\ncase "$1" in -s) echo %s ;; -m) echo %s ;; esac\n' "$1" "$2" > fake-uname-bin/uname
            chmod +x fake-uname-bin/uname
          }
          # $1 is stdout in full, $2 something stderr has to contain, then the
          # uname -s and uname -m that select the branch under test - or none,
          # for the runner's own.
          expect_streams() {
            if [ $# -gt 2 ]; then
              fake_uname "$3" "$4"
            else
              rm -rf fake-uname-bin
            fi
            status=0
            PATH="$PWD/fake-fail-bin:$PWD/fake-uname-bin:$PATH" \
              $SH "$SCRIPT" > out.txt 2> err.txt || status=$?
            [ "$status" != 0 ] || fail "[${3-} ${4-}] should not have reported success"
            [ "$(cat out.txt)" = "$1" ] || fail "[${3-} ${4-}] stdout was '$(cat out.txt)', wanted '$1'"
            grep -qF "$2" err.txt || fail "[${3-} ${4-}] stderr does not say '$2': $(cat err.txt)"
          }
          check() {
            # The one line a failed default run is allowed to put on stdout.
            expect_streams "Downloading Pockode for $PLATFORM..." 'Download failed:'

            # The branches below need a uname the runner does not have, and
            # busybox ash answers uname from its own applet without consulting
            # PATH - a fake cannot reach it, so the other shells carry these
            # three. Asked rather than assumed: a shell that starts or stops
            # doing this changes what runs here without anyone editing it.
            fake_uname Plan9 x86_64
            if [ "$(PATH="$PWD/fake-uname-bin:$PATH" $SH -c 'uname -s')" != Plan9 ]; then
              echo "$SH answers uname itself; leaving the faked-uname branches to the other shells"
              return 0
            fi
            expect_streams '' 'install.ps1' MINGW64_NT-10.0-26100 x86_64
            expect_streams '' 'Unsupported OS: Plan9' Plan9 x86_64
            expect_streams '' 'Unsupported architecture: riscv64' Linux riscv64
          }
          for_each_shell check
