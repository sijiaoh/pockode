name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # A tag with a dash (v0.21.0-alpha.1) is a pre-release, as in semver.
  PRERELEASE: ${{ contains(github.ref_name, '-') }}

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/.go-version
          cache-dependency-path: server/go.sum

      - name: Build
        run: VERSION=${GITHUB_REF_NAME} ./scripts/build.sh

      # draft: true is what makes the assets land. With immutable releases on,
      # an asset can only be uploaded while the release is still a draft, and
      # action-gh-release only creates a draft on its own when prerelease is
      # false - a prerelease is created already published, so every upload into
      # it fails with a 422. Asking for a draft explicitly takes both paths
      # through the same sequence: create, upload, then publish below.
      - name: Create draft release
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          prerelease: ${{ env.PRERELEASE }}
          # Categorized by .github/release.yml.
          generate_release_notes: true

      # The accident this workflow is being fixed for was a release that ended
      # up published with no assets at all. The upload failure was reported, so
      # this is not a second chance to catch that one - it is what turns "the
      # release is short a binary" into a red run instead of something a user
      # finds by downloading it. It runs while the release is still a draft so
      # that an incomplete one never becomes visible: a draft that fails here is
      # deleted by hand, which is the cheaper of the two cleanups.
      #
      # The checks live in a script because a tag push is the only thing that
      # ever runs this step: scripts/verify-release-assets.test.sh drives that
      # script against a stubbed gh, which is as much of this as can be tried
      # before a release.
      - name: Verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: ./scripts/verify-release-assets.sh dist

      # draft: true also disables the action's own publish step, so the release
      # would stay a draft forever without this. Addressed by id rather than by
      # tag because the release is still a draft here, and a draft is not what
      # /releases/tags/{tag} answers with. make_latest is spelled out because it
      # otherwise defaults to true, and install.sh installs whatever
      # /releases/latest points at.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          MAKE_LATEST: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
        run: |
          gh api --method PATCH --silent \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest="$MAKE_LATEST"

      # pockode.com builds its changelog and footer version from GitHub
      # Releases at build time, and nothing else rebuilds it when a release is
      # published, so the release would not appear there until the next deploy.
      # SITE_DEPLOY_HOOK is the host's deploy hook URL. Pre-releases are left
      # out because the site shows stable releases only.
      - name: Rebuild pockode.com
        if: ${{ env.PRERELEASE != 'true' }}
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$SITE_DEPLOY_HOOK" ]; then
            echo "::warning::SITE_DEPLOY_HOOK is not set, so pockode.com shows $GITHUB_REF_NAME only after its next deploy."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 -X POST "$SITE_DEPLOY_HOOK" > /dev/null
