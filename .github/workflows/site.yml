name: Site

# Builds pockode.com, checks that the README's links to it land on pages the
# build produces, and holds the mobile homepage to a Lighthouse score of 90 in
# performance, accessibility and SEO, best of five runs (site/README.md#checks).
# The README is watched because its links are half of that check.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "scripts/site/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".node-version"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "scripts/site/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".node-version"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the link check
        run: node --test "scripts/site/*.test.mjs"

      # Through the script the host builds with too, so both use the Hugo it
      # pins. The changelog fetches GitHub Releases; without a token the API
      # allows 60 requests an hour per IP, which a shared runner can run out of.
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/site/hugo.sh --gc --minify

      - name: Check the README's links to the site
        run: node scripts/site/links.mjs site/public

      - name: Lighthouse on the mobile homepage
        working-directory: site
        run: pnpm exec lhci autorun

      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: site/.lighthouseci/reports
          if-no-files-found: ignore
