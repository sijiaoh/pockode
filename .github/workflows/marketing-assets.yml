name: Marketing assets

# Regenerates site/static/marketing (docs/marketing-assets.md §9) from the
# current UI and opens a pull request when anything changed. By hand only: a
# run takes up to an hour, and whether the UI has changed enough to be
# worth new screenshots is a person's call.
#
# Opening the pull request needs "Allow GitHub Actions to create and approve
# pull requests" in the repository's Actions settings. A pull request opened
# with GITHUB_TOKEN starts no workflows of its own; it only touches images.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: marketing-assets-${{ github.ref_name }}

jobs:
  regenerate:
    # The pull request goes to the branch the run was started on.
    if: github.ref_type == 'branch'
    # Pinned rather than ubuntu-latest: run.sh fills in the headless browser's
    # missing libraries from Ubuntu 24.04 packages, and the pixels depend on
    # the system the browser draws on.
    runs-on: ubuntu-24.04
    # Two full renders when anything changed; a single one is 15–25 minutes.
    timeout-minutes: 120

    steps:
      # The full history: the video's terminal shows the nearest release tag.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/.go-version
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --confirm: an unattended run would otherwise turn glyph antialiasing
      # noise into a pull request (see `assets` in run.sh).
      - name: Regenerate assets
        run: scripts/ui-walkthrough/run.sh assets --confirm

      # On the run's page, not only deep in its log: an asset left as it was
      # may be hiding a real change behind the noise.
      - name: Report unconfirmed assets
        run: |
          list=.walkthrough/assets-unconfirmed.txt
          [ -s "$list" ] || exit 0
          while IFS= read -r file; do
            echo "::warning::Rendered differently twice, left as committed: site/static/marketing/$file"
          done <"$list"

      - name: Upload captures and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough
          # Without it the whole of .walkthrough/ is left out as hidden.
          include-hidden-files: true
          path: |
            .walkthrough/shots/
            .walkthrough/state/*/*.log
          retention-days: 7

      # One branch per base, force-pushed, so a second run updates the open
      # pull request instead of opening another, and a run that finds nothing to
      # change closes it.
      - name: Open, update or close the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          branch="marketing-assets/$BASE"
          pr="$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[].number')"
          if [ -z "$(git status --porcelain -- site/static/marketing)" ]; then
            echo "The assets are up to date."
            # An earlier run's pull request would now take them back to older bytes.
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch --comment "The assets on \`$BASE\` are up to date as of $GITHUB_SHA."
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A site/static/marketing
          git commit -m "Regenerate marketing assets"
          git push --force origin "$branch"
          body="Regenerated by the [Marketing assets workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from \`$BASE\` at $GITHUB_SHA."
          list=.walkthrough/assets-unconfirmed.txt
          if [ -s "$list" ]; then
            body+=$'\n\nRendered differently in each of two runs, so left as committed:\n'
            while IFS= read -r file; do
              body+=$'\n'"- \`site/static/marketing/$file\`"
            done <"$list"
          fi
          if [ -z "$pr" ]; then
            gh pr create --base "$BASE" --head "$branch" --title "Regenerate marketing assets" --body "$body"
          else
            gh pr edit "$pr" --body "$body"
          fi
