<!doctype html>
<title>Landed</title>
<!-- Where a test's page tries to navigate itself or embed a document; says so
     if it ever arrives. To every window above it, since how deep it landed
     depends on the way it got here, and to the window that opened it, when it
     landed in a popup of its own. -->
<script>
	for (var w = window; w !== w.parent; w = w.parent) {
		w.parent.postMessage({ signal: "landed" }, "*");
	}
	if (window.opener) window.opener.postMessage({ signal: "landed" }, "*");
</script>
