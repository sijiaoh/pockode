# Pockode's public messaging — the one place its copy is written.
#
# Read by the Hugo site (hugo.Data.messaging), the README generator
# (scripts/messaging; `pnpm run readme` rewrites the README's marked blocks) and
# the marketing asset renderers (scripts/ui-walkthrough/marketing). Change
# wording here, never in a consumer; CI fails when the README disagrees.
# What to run after an edit: site/README.md.
#
# Rules that keep it readable by all three:
# - Plain YAML only: no anchors, no tags, no multi-document files.
# - Values are plain text. The one markup allowed is inline `code` in
#   backticks; each consumer renders it its own way.
# - Lists keep their order; consumers draw items in the order given. An `id`
#   is a stable key for a consumer's own presentation (an icon, a tab), never
#   shown.
# - Command-line flags use the single-dash style Go's flag package prints
#   (`-password`, `-relay=false`), and only flags the server actually has —
#   CI checks both against the server's own -h, here and across the site.
# - Claim only what the product does. The license is source-available, not
#   open source, and the AI CLI sends code to its provider, so never say code
#   stays on the machine.

name: Pockode
url: https://pockode.com
repo: https://github.com/sijiaoh/pockode

tagline: Your coding agents keep working. Steer them from your phone.
subtitle: Hand stories to a team of Claude Code and Codex agents on your own machine, answer their questions and ship the result from any browser.

# The homepage's screens 2-5, in order; the README lists the same title and
# description.
pillars:
  - id: delegate
    title: Delegate
    description: Split a story into tasks, each run by a Claude Code or Codex agent in its own role.
  - id: loop
    title: Stay in the loop
    description: When an agent needs a decision, it stops and asks; you answer from anywhere.
  - id: ship
    title: Review & ship
    description: Read the diff, commit, and open your dev server on your phone with Port Preview.
  - id: machine
    title: Your machine
    description: Pockode dials out from beside your project, so there is no port to forward.
    # Shown on the homepage's Your machine screen, one icon each (keyed by id).
    facts:
      - id: cli
        text: Your own `claude` or `codex` CLI
      - id: tls
        text: TLS on both relay hops
      - id: local
        text: "`-relay=false` keeps the app on your network"

quickstart:
  prerequisite: Pockode drives the `claude` or `codex` CLI. Have neither? Install one and sign in from the app; that needs `npm` (Node.js).
  run_where: on your dev machine, in your project directory
  next: Scan the QR code with your phone.
  installers:
    - id: unix
      label: macOS / Linux
      shell: sh
      install: curl -fsSL https://pockode.com/install.sh | sh
      run: pockode -password YOUR_PASSWORD
    - id: windows
      label: Windows
      shell: powershell
      install: irm https://pockode.com/install.ps1 | iex
      run: pockode -password YOUR_PASSWORD

# The release binaries (docs/platforms.md has the full table).
platforms:
  - name: macOS
    arch: Intel and Apple silicon
  - name: Linux
    arch: amd64 and arm64
  - name: Windows
    arch: x64, also on Windows 11 on Arm

license:
  label: Source available
  name: O'Saasy License
  file: LICENSE.md
  summary: You may use, modify and redistribute it, but not offer it to others as a competing hosted service.

# The homepage's FAQ, in order. An entry with no answer takes it from
# elsewhere in this file, keyed by id: `platforms` from platforms, `license`
# from license. Any other entry without one fails the build.
faq:
  - id: code
    question: Does my code leave my machine?
    answer: Your AI CLI sends code to its provider, as it does without Pockode. Through the relay, traffic is encrypted on both hops, and its content is never inspected or stored.
  - id: agents
    question: Which agents does it work with?
    answer: Claude Code and Codex, with your own login and subscription. Pockode drives the CLI on your machine; if it is missing, install it and sign in from the app.
  - id: ports
    question: Do I have to open a port?
    answer: No. Pockode dials out to the relay. With `-relay=false` you connect over your own network instead, in plain HTTP.
  - id: platforms
    question: Which platforms does it run on?
  - id: license
    question: What is the license?

# The homepage's remaining words: what its buttons and links say.
homepage:
  get_started: Get started
  github: GitHub
  security: How it is secured
  faq: Questions
  docs: More in the docs

# How the pictures are described to a screen reader, on the site and in the
# README alike. Plain text only: an alt text cannot show `code`. Describe what
# the picture shows, and claim no more than the rest of this file does.
images:
  # The demo video on the homepage and its GIF in the README.
  demo: "A 30-second demo of Pockode: a story split into tasks that agents work on in parallel, an agent's question answered from a phone, the diff, Port Preview and a commit"
  # The architecture figure, both its variants, on the homepage and /security/.
  architecture: Your phone connects to the relay over HTTPS. Your PC opens an outbound tunnel to the relay and runs the claude or codex CLI. Both links to the relay are encrypted, and your machine opens no port.
  # Keyed by file name in site/static/marketing/screenshots, so a capture is
  # described once wherever it appears.
  screenshots:
    desktop: "Pockode in a desktop browser: a story, its three running tasks and their sessions in the sidebar"
    phone-story: A story, Add due dates to todos, with three tasks assigned to Engineer agents and one question waiting for your answer
    phone-question: "An agent's question on a phone: where should todos without a due date go? The recommended answer is to put them after dated todos."
    phone-commit: The Git commit sheet with the message Add due dates to todos
    phone-diff: The diff of TodoItem.tsx on a phone
    phone-preview: The todo app's dev server, opened on the phone with Port Preview
