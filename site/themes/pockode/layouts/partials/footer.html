{{- $m := hugo.Data.messaging -}}
<footer class="footer">
  <p class="footer-logo">{{ $m.name }}</p>
  <p class="footer-tagline">{{ $m.tagline }}</p>
  <div class="footer-links">
    <a href="{{ $m.repo }}" target="_blank" rel="noopener">GitHub</a>
    <a href="{{ $m.repo }}/issues" target="_blank" rel="noopener">Issues</a>
    <a href="{{ $m.repo }}/blob/main/{{ $m.license.file }}" target="_blank" rel="noopener">License</a>
    <a href="/privacy">Privacy</a>
  </div>
  <p class="footer-copy">{{ $m.license.label }} under the {{ $m.license.name }}.</p>
</footer>
