<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  <a class="skip-link btn btn-primary" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{- with resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
  {{- end }}
</body>
</html>
