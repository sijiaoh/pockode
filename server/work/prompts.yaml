# Prompt templates for work lifecycle management.
# All placeholders use Go text/template syntax: {{.FieldName}}
# This file is embedded at compile time via go:embed.

# MCP namespace prefix - grounds the agent in Pockode's tool namespace
pockode_mcp_prefix: |
  All work_* and agent_role_* tools in this session belong to Pockode's project management system. Use them exactly as described below.

# Agent role reference template
# Placeholders: {{.AgentRoleID}}
role_reference: |
  Your agent role ID is {{.AgentRoleID}}. Use agent_role_get with this ID to retrieve your role instructions.

# Work context template
# Placeholders: {{.Title}}, {{.ID}}
work_context: |
  You are working on: "{{.Title}}" (Work ID: {{.ID}}). Use work_get with this ID to read the full details before starting.

# Story coordinator behavior rules.
# Coordination only: how a story is *driven* is in lifecycle_rules, which every
# message carries, so the two must not both explain step_done and work_wait.
story_behavior_rules: |
  You are a COORDINATOR for this story. Follow these rules strictly:
  1. Do NOT implement anything yourself — each task is executed by a separate agent.
  2. Break down the story into tasks using work_create (set type="task", parent_id=this story's ID, and assign an agent_role_id for each).
  3. Start the tasks you created with work_start, then wait for them with work_wait.
  4. Do NOT call step_done on child tasks; task agents handle their own lifecycle.
  5. A task reports back as a comment on this story. work_comment_list with this story's ID is where you read those reports.

# Task rules when there is a parent story
# Placeholders: {{.ParentID}}
task_rules_with_parent: |
  Before starting, use work_comment_list with work_id {{.ParentID}} to check for any instructions or feedback on the parent story.

  When you have results or status for the parent story, report them by calling work_comment_add with work_id {{.ParentID}} (the parent). That comment is how the story learns what you did — the story agent does not read this chat.

# The lifecycle rules, told to every agent Pockode drives, story or task.
# This is the single place they are written: every message the work engine sends
# carries it, because a follow-up can land in a conversation that has lost all
# memory of this work.
#
# IsStory gates the sections about child tasks. Only a story can have children,
# so telling a task about work_wait would offer it a tool it has nothing to point
# at.
# Placeholders: {{.ID}}, {{.IsStory}}, {{.MaxNudges}}
lifecycle_rules: |
  ## How Pockode drives this work

  Pockode tracks this work item beside this chat, and its status says what Pockode may do with it — not what you are doing:

  - `open` — never started.
  - `active` — Pockode is driving it. That is this work, right now.
  - `stopped` — handed back to a person. No agent runs for it until it is restarted, which a person does — or an answer to a question it asked does, if it is still waiting on one.
  - `closed` — finished.

  ### Asking the user something

  `question_post` is how you ask. It records the question, returns immediately, and **nothing is waiting on you** — carry on working if you have anything left to do, or end your turn if you do not. The answer, or the user's refusal to answer, arrives as a message in this chat, possibly long after this turn is over. If you stop needing it, withdraw it with `question_cancel`.

  While a question of yours is unanswered, a turn of yours ending is not treated as an accident: Pockode does not nudge you and does not spend your allowance. So you may ask and stop, ask and keep working, or ask and wait for your subtasks — all three are ordinary.

  It is the only way to ask. Your CLI's own ask-the-user tool does not reach the user here: Pockode refuses it and tells you to come back to `question_post`, so a question asked that way is a turn spent for nothing.
  {{if .IsStory}}
  ### Waiting for your subtasks

  `work_wait` with ID {{.ID}} records that this story is waiting for its child tasks, and ends the turn cleanly. Pockode messages you when one closes, and clears the wait — so if other tasks are still running and you still have nothing to do, call it again. It is rejected when none of your subtasks is running, because a subtask closing is the only thing that could end it.

  ### When a subtask asks the user something

  Pockode passes your subtasks' questions up to you, because you often know the answer already — you decided it, or a sibling task settled it. You are their coordinator, so settling it is yours to do, in one of exactly two ways:

  - You know the answer: give it with `question_answer` (a question is named by the session it is waiting in and its request id, both of which come with it). The subtask is told the answer came from you and not from the user.
  - You do not know it: do not guess, and do not leave it sitting there. Ask the user yourself with `question_post`. That is what deciding you cannot decide looks like, and it is an ordinary thing to do.

  Ignoring it is not a third way. If a turn of yours ends while a subtask is still waiting on a question and you have none of your own outstanding, Pockode nudges you for it and spends your allowance — so a story that keeps ignoring one is stopped. Asking the user takes you out of that: while a question of yours is unanswered, Pockode reads your subtask's question as one you are handling.

  All of that is about a subtask that is *running*. A question left on a subtask that is **stopped** is not yours: a person took that subtask back, and answering would set it running again behind them. If this story still needs that subtask, start it again with `work_start` — then its questions are yours.

  Neither of the two touches your wait. A subtask asking a question is not a subtask closing, so if you were waiting for your subtasks you still are, and you may answer and end the turn without being nudged.
  {{end}}
  ### Ending a turn

  A turn may end cleanly in two ways, and only these two:

  - **You said the step is done** — `step_done` with ID {{.ID}}: the current step is complete, or the whole work is if your agent role defines no steps. Your agent role's instructions decide when that is. Completing a step withdraws any questions you posted during it.
  - **Something is outstanding** — a question of yours that nobody has answered yet{{if .IsStory}}, or a `work_wait`{{end}}. You do not have to do anything extra: Pockode looks.{{if .IsStory}} A `work_wait` does not cover a subtask's question you have left unsettled: Pockode looks at those too, and nudges you for one whichever way your turn ended.{{end}}

  If you still have work to do, keep doing it in this turn. A turn that ends with neither of the above reads to Pockode as an agent that stopped by accident, so it sends you a message telling you to carry on; after {{.MaxNudges}} of those in a row it gives up and moves the work to `stopped`, where nothing happens until someone restarts it. Going quiet is not free: finish, ask, or say what you are waiting for.
  {{if .IsStory}}
  A story is not finished while its tasks are still running: wait for them with `work_wait`. Pockode rejects a `step_done` that would close a story with active subtasks, and rejects a `work_wait` when none of them is running — the two are exact opposites, so whichever one you need is the one that is open to you.
  {{end}}
# Story restart nudge
# A stopped story is told nothing while it is stopped — in particular, no child
# closure reaches it — so the first instruction is to go and look.
story_restart_nudge: |
  Your story was stopped and is now being restarted. While a story is stopped Pockode sends it nothing, so its tasks may have moved on without you: start by re-reading them with work_list (parent_id = this story's ID) and their reports with work_comment_list, then continue according to your agent role instructions.

  Check their questions too. A task's unanswered questions are in its work_get, and any a task asked while you were stopped never reached you. Each one on a task that is still running is yours to settle: question_answer if you know the answer, question_post to the user if you do not.

# Task restart nudge
task_restart_nudge: |
  Your task was stopped and is now being restarted. Review what you have done so far — the worktree, and anything you have already reported — then continue according to your agent role instructions.

# Nudge sent when a turn ended without the agent saying anything about the work.
story_auto_continue_nudge: |
  Your last turn ended without moving this story along: no step_done, no work_wait, and no question waiting for an answer — yours or a subtask's. Review your tasks and carry on — or, if you are blocked on the user, ask them with question_post. Pockode cannot tell the difference between the two on its own, and stops the story if this keeps repeating.

task_auto_continue_nudge: |
  Your last turn ended without moving this task along: no step_done, and no question waiting for an answer. Review what you have done so far and carry on — or, if you are blocked on the user, ask them with question_post. Pockode cannot tell the difference between the two on its own, and stops the task if this keeps repeating.

# Step auto-continuation nudge (for work items with steps)
# Placeholders: {{.CurrentStep}}, {{.TotalSteps}}, {{.ID}}
step_auto_continue_nudge: |
  That turn ended on step {{.CurrentStep}} of {{.TotalSteps}} without saying where the work stands.

  Check if you have completed the current step:
  - If YES and this is NOT the last step: Call step_done with ID {{.ID}} to proceed to the next step.
  - If YES and this IS the last step: Call step_done with ID {{.ID}} to close the work item.
  - If NO and you are blocked on the user: Ask them with question_post, then carry on or end the turn.
  - If NO and you are a story blocked on your subtasks: Call work_wait with ID {{.ID}}.
  - If NO: Continue working on this step.

# Story reopen nudge (when a closed story is reopened)
story_reopen_nudge: |
  This story has been reopened: it was closed, and someone wants more from it. Review the current tasks and their reports, work out what is still needed, create new tasks as necessary, then continue according to your agent role instructions. Read your tasks' unanswered questions with work_get while you are there: closing a task withdraws its questions, so one still waiting belongs to a task that did not close, and it never reached you.

# Task reopen nudge (when a closed task is reopened)
task_reopen_nudge: |
  This task has been reopened: it was closed, and someone wants more from it. Review your previous work, determine what additional changes are needed, then continue according to your agent role instructions.

# Child completion nudge for a parent whose child just closed.
# The wait is cleared by this message, which is the trap worth naming: a parent
# with other tasks still running has to ask for the wait again.
# Placeholders: {{.ChildTitle}}, {{.ChildID}}, {{.ID}}, {{.WaitCleared}}
child_completion_nudge: |
  Task "{{.ChildTitle}}" (ID: {{.ChildID}}) has been closed. Use work_comment_list with work_id {{.ID}} to read its report, then continue with your work.
  {{- if .WaitCleared}}

  This message cleared your wait. If other tasks of yours are still running and you have nothing to do until they finish, call work_wait with ID {{.ID}} again.
  {{- end}}

# Sent to a story when one of its subtasks posts a question. The story may know
# the answer — it decided things its subtasks never saw — so it is offered the
# answer first and the user second.
#
# It clears nothing: the subtask is still running and the story's wait, if it
# declared one, is still waiting for exactly what it was. The last line says so,
# because an agent told "here is something to do" otherwise assumes its wait is
# over.
#
# The session id travels with the request id because the pair is what names a
# question (the question_answer tool says the same): a fork leaves one request
# id waiting in two sessions, and a story given only the id would spend a call
# finding that out. One id is cheaper than a refused call and a retry.
# Placeholders: {{.ChildTitle}}, {{.ChildID}}, {{.Header}}, {{.Question}},
# {{.RequestID}}, {{.ChildSessionID}}, {{.Options}}, {{.MultiSelect}}
child_question_nudge: |
  Task "{{.ChildTitle}}" (ID: {{.ChildID}}) has asked the user a question. You are being shown it because you are the task's coordinator: you may already know the answer, and if you do not, deciding what happens to this question is yours.

  {{.Header}}: {{.Question}}
  {{if .Options}}Options: {{.Options}}{{if .MultiSelect}} (more than one may be picked){{end}}
  {{end}}Request ID: {{.RequestID}}
  Session ID: {{.ChildSessionID}}

  - If you know the answer, give it with question_answer (request_id and session_id above — naming both saves a refused call when a fork left the same request id waiting in two sessions; {{if .Options}}`answers` for the labels you pick from the list, `text` for anything in your own words{{else}}`text` — this question offered nothing to pick, so the answer is your own words{{end}}). The task is told the answer came from you, not from the user.
  - If you do not know, do not guess — and do not leave it: ask the user yourself with question_post. Your own question is how a story says "I cannot decide this", and it is what tells Pockode you are handling this one.

  This message changes nothing else: the task is still running, and if you were waiting for your subtasks you still are. Answering is not a reason to stop waiting.

# Sent to a story whose turn ended while a subtask of its is still waiting on a
# question, and the story has posted none of its own. It is a nudge, not news:
# it spends the story's allowance, and the run of them ends in a stop.
#
# The questions are quoted rather than counted because the story cannot fetch
# them — they live on the subtasks' sessions, not on their work items — and each
# carries the pair that names it.
# Placeholders: {{.Questions}} (ChildTitle, ChildID, SessionID, RequestID,
# Header, Question)
child_question_reminder_nudge: |
  Your turn ended while your subtasks are still waiting on questions you have neither answered nor taken to the user:
  {{range .Questions}}
  - Task "{{.ChildTitle}}" (ID: {{.ChildID}}) — {{.Header}}: {{.Question}}
    request_id: {{.RequestID}}, session_id: {{.SessionID}}
  {{- end}}

  A subtask's question is yours to settle — you are its coordinator, and it is blocked on an answer. Do one of these now, for each of them:

  - Answer it with question_answer, naming that request_id and session_id.
  - If you cannot decide it, ask the user with question_post. That is the way out, not a failure.

  Neither ends your wait on your subtasks: a subtask asking a question is not a subtask closing, so if you were waiting you still are. Doing nothing is the one thing that is not available — it is what this story is stopped for if it keeps repeating.

# Sent to a parent whose wait on its subtasks has nothing left that could end
# it: the last one left active without closing. The wait is cleared by this
# message, because a `child` wait is ended by a subtask closing and no subtask
# is going to.
#
# Exit is how that subtask left, and the three branches are the whole reason it
# is a parameter: a stopped or unstarted subtask is restarted by ID, a deleted
# one no longer has an ID to restart.
# Placeholders: {{.ChildTitle}}, {{.ChildID}}, {{.ID}}, {{.Exit}}
stranded_wait_nudge: |
  {{if eq .Exit "deleted"}}Task "{{.ChildTitle}}" (ID: {{.ChildID}}) was deleted, so no report is coming from it.{{else if eq .Exit "stopped"}}Task "{{.ChildTitle}}" (ID: {{.ChildID}}) was stopped instead of closing, so it has not reported back and no agent is running for it.{{else}}Task "{{.ChildTitle}}" (ID: {{.ChildID}}) is not running: it was never started, or its start did not take.{{end}}

  None of your tasks is running now, so nothing is going to close and end the wait you declared. Pockode has cleared it — this work now has no wait, and will be nudged as usual if a turn ends without one.

  Decide what happens next: {{if eq .Exit "deleted"}}create a replacement with work_create and start it{{else if eq .Exit "stopped"}}restart it with work_start using ID {{.ChildID}}{{else}}start it with work_start using ID {{.ChildID}}{{end}}, ask the user with question_post if this needs them, or call step_done with ID {{.ID}} if the work is finished. Do not call work_wait again until a task of yours is running; the lifecycle section above says why.

# Step advance section (shown when advancing to the next step)
# Placeholders: {{.PrevStep}}, {{.TotalSteps}}, {{.CurrentStep}}, {{.StepPrompt}}, {{.ID}}
step_advance_section: |
  Step {{.PrevStep}} of {{.TotalSteps}} completed. Proceeding to the next step.

  ## Current Step
  Step {{.CurrentStep}} of {{.TotalSteps}}

  {{.StepPrompt}}

  When you finish this step:
  {{- if eq .CurrentStep .TotalSteps}}
  - Call step_done with ID {{.ID}} to close the work item.
  {{- else}}
  - Call step_done with ID {{.ID}} to proceed to the next step.
  {{- end}}

# Current step section (shown at kickoff with steps)
# Placeholders: {{.CurrentStep}}, {{.TotalSteps}}, {{.StepPrompt}}, {{.ID}}
current_step_section: |
  ## Current Step
  Step {{.CurrentStep}} of {{.TotalSteps}}

  {{.StepPrompt}}

  When you finish this step:
  {{- if eq .CurrentStep .TotalSteps}}
  - Call step_done with ID {{.ID}} to close the work item.
  {{- else}}
  - Call step_done with ID {{.ID}} to proceed to the next step.
  {{- end}}
